<!DOCTYPE html>
<html>
<head>
    <title>Food Ordering Form</title>
</head>
<body>

    <h2>Campus Cafeteria Food Ordering Form</h2>

    <form>

        <label>Customer Name:</label><br>
        <input type="text">
        <br><br>

        <label>Phone Number:</label><br>
        <input type="tel">
        <br><br>

        <label>Select Food:</label><br>

        <select name="food">
            <option value="Fried Rice">Fried Rice</option>
            <option value="Chicken Rice">Chicken Rice</option>
            <option value="Burger">Burger</option>
            <option value="Noodles">Noodles</option>
        </select>

        <br><br>

        <label>Quantity: (1-10)</label><br>
        <input type="number" min="1" max="10">
        <br><br>

        <label>Collection Time:</label><br>
        <input type="time">
        <br><br>

        <label>Special Instructions:</label><br>
        <textarea name="instructions"></textarea>

        <br><br>

        <button type="submit">Place Order</button>
        <button type="reset">Clear Order</button>

    </form>

</body>
</html>
