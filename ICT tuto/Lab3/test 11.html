<!DOCTYPE html>
<html>
<head>
    <title>Student Course Feedback Form</title>
</head>
<body>

    <h2>Student Course Feedback Form</h2>

    <form>

        <label>Student Name:</label><br>
        <input type="text">
        <br><br>

        <label>Course Name:</label><br>

        <select>
            <option >Web Programming</option>
            <option >Basic ICT</option>
            <option >Programming</option>
            <option >Database</option>
        </select>

        <br><br>

        <label>Teaching Satisfaction:</label><br>

        <input type="radio" name="satisfaction">
        Excellent<br>

        <input type="radio" name="satisfaction">
        Good<br>

        <input type="radio" name="satisfaction">
        Fair<br>

        <input type="radio" name="satisfaction">
        Poor<br><br>

        <label>Preferred Learning Materials:</label><br>

        <input type="checkbox">
        Lecture Slides<br>

        <input type="checkbox">
        Videos<br>

        <input type="checkbox">
        Exercises<br>

        <input type="checkbox">
        Quizzes<br><br>

        <label>Satisfaction Rating (1 to 5):</label><br>

        <input type="number" min="1" max="5">
        <br><br>

        <label>Additional Comments:</label><br>

        <textarea></textarea>

        <br><br>

        <button type="submit">Submit Feedback</button>
        <button type="reset">Clear Feedback</button>

    </form>

</body>
</html>
