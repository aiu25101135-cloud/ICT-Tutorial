<!DOCTYPE html>
<html>
<head>
    <title>Tech Innovation Day Registration</title>
</head>
<body>

    <h2>Tech Innovation Day Registration Form</h2>

    <form>

        <label>Full Name:</label><br>
        <input type="text">
        <br><br>

        <label>Student Email:</label><br>
        <input type="email">
        <br><br>

        <label>Participation Category:</label><br>

        <input type="radio" name="category">
        Participant<br>

        <input type="radio" name="category">
        Volunteer<br>

        <input type="radio" name="category">
        Committee Member<br><br>

        <label>Preferred Activities:</label><br>

        <input type="checkbox">
        Web Development<br>

        <input type="checkbox">
        Artificial Intelligence<br>

        <input type="checkbox">
        Cybersecurity<br><br>

        <label>Programme:</label><br>

        <select>
            <option>
                Foundation in Computing
            </option>

            <option>
                Foundation in Arts
            </option>
        </select>

        <br><br>

        <button type="submit">Register</button>
        <button type="reset">Reset</button>

    </form>

</body>
</html>
