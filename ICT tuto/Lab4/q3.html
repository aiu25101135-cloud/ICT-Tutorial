<!DOCTYPE html>
<html lang="en">
<head>
    <title>Data Types and Typeof</title>
</head>

<body>

    <h1>JavaScript Data Types Demonstration</h1>

    <script>
        let studentName = "Sarah";
        let studentAge = 19;
        let courseFee = 2500.50;
        let isRegistered = true;
        let studentAddress = null;

        console.log(studentName);
        console.log(studentAge);
        console.log(courseFee);
        console.log(isRegistered);
        console.log(studentAddress);

        console.log(typeof studentName);
        console.log(typeof studentAge);
        console.log(typeof courseFee);
        console.log(typeof isRegistered);
        console.log(typeof studentAddress);
    </script>

</body>
</html>
